name: Тесты

on:
  push:
  pull_request:

# новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Тесты API, PDF, Jira и автозаполнения
        timeout-minutes: 5
        run: pytest tests/test_api.py tests/test_pdf.py tests/test_jira.py tests/test_autofill.py tests/test_composition.py tests/test_history.py tests/test_forecast.py tests/test_notifications.py -v

      - name: Браузерные тесты (e2e)
        timeout-minutes: 10
        run: pytest tests/test_e2e.py -v
