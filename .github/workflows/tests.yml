name: Тесты

on:
  push:
  pull_request:

# новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка зависимостей
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Серверные тесты (API, PDF, Jira, аналитика, уведомления)
        timeout-minutes: 8
        run: python -m coverage run -m pytest tests/ --ignore=tests/test_e2e.py -v

      - name: Браузерные тесты (e2e)
        timeout-minutes: 12
        run: python -m coverage run -a -m pytest tests/test_e2e.py -v

      - name: Покрытие кода тестами (порог — в .coveragerc)
        run: python -m coverage report
